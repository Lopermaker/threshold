<title>Threshold</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
/* Threshold: a single dark world. The page is only a frame for two canvases. */
:root { color-scheme: dark; --ink: #000; --amber: #ffb000; }
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--amber); overflow: hidden; font-family: "VT323", ui-monospace, monospace; }
#gl, #hud { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#hud { pointer-events: none; }
#files { display: none; }
#fatal { position: fixed; left: 16px; right: 16px; top: 16px; padding: 12px 14px; background: #120000; border: 1px solid #5a1a10; color: #ffb000; font-size: 20px; white-space: pre-wrap; }
</style>
<canvas id="gl" aria-label="Threshold"></canvas>
<canvas id="hud" aria-hidden="true"></canvas>
<input id="files" type="file" multiple accept="audio/*,image/*,.wav,.ogg,.mp3,.flac,.png,.jpg,.jpeg,.webp">
<div id="fatal" hidden></div>
<script>/*BUNDLE*/</script>
